<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ホーム画面に追加して開くと、アドレスバーなしの全画面で表示される -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="迷路を作るアプリ３">
<title>迷路ジェネレーター — 印刷用に最適化</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    color: #000;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.6rem;
    letter-spacing: 0.08em;
  }

  .controls {
    margin-bottom: 0.8rem;
    display: flex;
    gap: 0.6rem;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .difficulty-group {
    display: flex;
    gap: 0;
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid #e67e22;
  }

  .diff-btn {
    background: #fff;
    color: #e67e22;
    border: none;
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
    border-right: 1px solid #e67e22;
  }
  .diff-btn:last-child { border-right: none; }
  .diff-btn:hover { background: #fdf2e9; }
  .diff-btn.active {
    background: #e67e22;
    color: #fff;
  }

  button.action-btn {
    background: #e67e22;
    color: #fff;
    border: none;
    padding: 0.5rem 1.4rem;
    font-size: 0.9rem;
    cursor: pointer;
    border-radius: 6px;
    font-family: inherit;
    font-weight: 600;
    transition: background 0.15s;
  }
  button.action-btn:hover { background: #cf6d17; }

  canvas { display: block; }

  .print-header {
    display: none;
    width: 180mm;
    margin-bottom: 4mm;
  }
  .print-header .name-row {
    display: flex;
    align-items: baseline;
    gap: 4mm;
    font-size: 14pt;
  }
  .print-header .name-label {
    font-weight: 700;
    white-space: nowrap;
  }
  .print-header .name-line {
    flex: 1;
    border-bottom: 1.5px solid #000;
    min-height: 1.2em;
  }

  @media print {
    html, body { height: 100%; }
    body { margin: 0; padding: 0; justify-content: center; }
    h1, .controls { display: none; }
    .print-header { display: flex; justify-content: center; }
    .print-header .name-row { width: 100%; }
    canvas {
      width: 180mm !important;
      height: auto !important;
      page-break-inside: avoid;
    }
    @page {
      size: A4 portrait;
      margin: 15mm;
    }
  }
/* スマホ用レイアウト調整2 */
@media screen and (orientation:landscape) and (max-height:500px), screen and (orientation:portrait) and (max-width:500px) {
  #mazeCanvas { max-width:calc(100vw - 16px); height:auto !important; }
  body { overflow-x:hidden; }
}
/* /スマホ用レイアウト調整2 */
</style>
</head>
<body>

<h1>MAZE — 迷路</h1>

<div class="controls">
  <div class="difficulty-group">
    <button class="diff-btn" data-level="easy" onclick="setDifficulty('easy')">やさしい</button>
    <button class="diff-btn active" data-level="normal" onclick="setDifficulty('normal')">ふつう</button>
    <button class="diff-btn" data-level="hard" onclick="setDifficulty('hard')">ちょいむず</button>
  </div>
  <button class="action-btn" onclick="regenerate()">生成</button>
  <button class="action-btn" onclick="window.print()">印刷</button>
</div>

<div class="print-header" id="printHeader">
  <div class="name-row">
    <span class="name-label">なまえ：</span>
    <span class="name-line"></span>
  </div>
</div>

<canvas id="mazeCanvas"></canvas>

<script>
// ==============================
// 改良版: メインルート全体にわたって
// 長めのデコイ分岐が均等に分布する迷路
// ==============================

const LEVELS = {
  easy:   { cols: 15, rows: 15, label: 'やさしい' },
  normal: { cols: 25, rows: 25, label: 'ふつう' },
  hard:   { cols: 35, rows: 35, label: 'ちょいむず' },
};

let currentLevel = 'normal';

const WALL_PX = 4;
const PADDING = 70;
const TARGET_MAZE_PX = 600;

const canvas = document.getElementById('mazeCanvas');
const ctx = canvas.getContext('2d');

function getCellSize(cols) {
  return Math.floor(TARGET_MAZE_PX / cols);
}

const DIRS = [
  [-1, 0, 0, 2], // up
  [ 0, 1, 1, 3], // right
  [ 1, 0, 2, 0], // down
  [ 0,-1, 3, 1], // left
];

function createGrid(rows, cols) {
  const grid = [];
  for (let r = 0; r < rows; r++) {
    grid[r] = [];
    for (let c = 0; c < cols; c++) {
      grid[r][c] = { walls: [true, true, true, true] };
    }
  }
  return grid;
}

// --- 改良版 Recursive Backtracking ---
// 「Newest/Random」ハイブリッド:
// 通常は最新セルから伸ばす(Newest)が、
// 一定確率でスタックのランダムな位置に戻って掘る(Random)。
// → メインの幹から横枝が途中で生えやすくなる。
function carveMaze(grid, rows, cols) {
  const visited = Array.from({length: rows}, () => new Uint8Array(cols));
  const startR = rows - 1, startC = cols - 1;
  const stack = [[startR, startC]];
  visited[startR][startC] = 1;

  // ランダム位置に戻る確率 (高いほど分岐が増える)
  const RANDOM_PROB = 0.25;

  while (stack.length > 0) {
    // Newest(末尾) or Random(ランダム位置)
    let idx;
    if (Math.random() < RANDOM_PROB && stack.length > 1) {
      idx = Math.floor(Math.random() * stack.length);
    } else {
      idx = stack.length - 1;
    }

    const [cr, cc] = stack[idx];
    const neighbors = [];
    for (const [dr, dc, wA, wB] of DIRS) {
      const nr = cr + dr, nc = cc + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !visited[nr][nc]) {
        neighbors.push([dr, dc, wA, wB, nr, nc]);
      }
    }

    if (neighbors.length === 0) {
      // このセルからはもう掘れない → スタックから除去
      stack.splice(idx, 1);
      continue;
    }

    // シャッフルして1つ選ぶ
    const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
    const [dr, dc, wA, wB, nr, nc] = pick;
    grid[cr][cc].walls[wA] = false;
    grid[nr][nc].walls[wB] = false;
    visited[nr][nc] = 1;
    stack.push([nr, nc]);
  }
}

// --- BFS: スタート→ゴールの正解経路 ---
function findSolutionPath(grid, rows, cols) {
  const prev = Array.from({length: rows}, () => new Array(cols).fill(null));
  const visited = Array.from({length: rows}, () => new Uint8Array(cols));
  const queue = [[0, 0]];
  visited[0][0] = 1;

  while (queue.length > 0) {
    const [r, c] = queue.shift();
    if (r === rows - 1 && c === cols - 1) {
      const path = [];
      let cr = r, cc = c;
      while (cr !== 0 || cc !== 0) {
        path.push([cr, cc]);
        [cr, cc] = prev[cr][cc];
      }
      path.push([0, 0]);
      path.reverse();
      return path;
    }
    for (const [dr, dc, wallIdx] of DIRS) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      if (visited[nr][nc] || grid[r][c].walls[wallIdx]) continue;
      visited[nr][nc] = 1;
      prev[nr][nc] = [r, c];
      queue.push([nr, nc]);
    }
  }
  return [];
}

// --- デコイ分岐の深さを計測 ---
function measureDecoyDepth(grid, rows, cols, startR, startC, fromR, fromC) {
  let maxD = 0;
  const stack = [[startR, startC, fromR, fromC, 0]];
  while (stack.length > 0) {
    const [r, c, pr, pc, d] = stack.pop();
    if (d > maxD) maxD = d;
    for (const [dr, dc, wallIdx] of DIRS) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      if (grid[r][c].walls[wallIdx]) continue;
      if (nr === pr && nc === pc) continue;
      stack.push([nr, nc, r, c, d + 1]);
    }
  }
  return maxD;
}

// --- 改良版スコアリング ---
// 重視ポイント:
//   1. 正解ルート上に「分岐点」(デコイ方向が開いてる)が多い
//   2. その分岐点がルート全体に均等に散らばっている
//   3. デコイが短すぎない（すぐ行き止まりだと迷わない）
function scoreMaze(grid, rows, cols) {
  const path = findSolutionPath(grid, rows, cols);
  if (path.length === 0) return { score: 0, path };

  const onPath = new Set();
  for (const [r, c] of path) onPath.add(r * cols + c);

  const pathLen = path.length;
  // 正解経路を5区間に分けて分岐点の分布を見る
  const NUM_SECTIONS = 5;
  const sectionLen = Math.max(1, Math.floor(pathLen / NUM_SECTIONS));

  // 各区間: 分岐点の数、デコイ深さの記録
  const sections = Array.from({length: NUM_SECTIONS}, () => ({
    branchCount: 0,    // この区間内の分岐点数
    decoyDepths: [],   // この区間内のデコイ深さ一覧
  }));

  // 「深いデコイ」の閾値 = グリッドサイズの12%以上
  const deepThreshold = Math.max(3, Math.floor(rows * 0.12));

  for (let i = 0; i < pathLen; i++) {
    const [r, c] = path[i];
    const sec = Math.min(Math.floor(i / sectionLen), NUM_SECTIONS - 1);

    let hasBranch = false;
    for (const [dr, dc, wallIdx] of DIRS) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      if (grid[r][c].walls[wallIdx]) continue;
      if (onPath.has(nr * cols + nc)) continue;
      // このセルはデコイ方向が開いている = 分岐点
      hasBranch = true;
      const depth = measureDecoyDepth(grid, rows, cols, nr, nc, r, c);
      sections[sec].decoyDepths.push(depth);
    }
    if (hasBranch) sections[sec].branchCount++;
  }

  // --- スコア計算 ---

  // (A) 分岐点の総数
  const totalBranches = sections.reduce((s, sec) => s + sec.branchCount, 0);

  // (B) 分岐点の均等分布: 全区間に分岐があるか
  const branchPerSection = sections.map(s => s.branchCount);
  const minBranches = Math.min(...branchPerSection);
  // 全区間に2個以上あれば最高、1個以上で中、0区間があるとペナルティ
  const uniformBranchBonus = minBranches >= 3 ? 4.0
                           : minBranches >= 2 ? 3.0
                           : minBranches >= 1 ? 1.5
                           : 0.1;

  // (C) 深いデコイの均等分布
  const allDecoys = sections.flatMap(s => s.decoyDepths);
  const deepPerSection = sections.map(
    s => s.decoyDepths.filter(d => d >= deepThreshold).length
  );
  const minDeepDecoys = Math.min(...deepPerSection);
  const uniformDeepBonus = minDeepDecoys >= 2 ? 3.0
                         : minDeepDecoys >= 1 ? 1.5
                         : 0.3;

  // (D) 全デコイの平均深さ
  const avgDecoy = allDecoys.length > 0
    ? allDecoys.reduce((a, b) => a + b, 0) / allDecoys.length
    : 0;

  // (E) 正解経路の長さ
  // 長い方がよい（蛇行している）

  const score = pathLen
    * (1 + totalBranches * 0.5)   // 分岐点が多いほど良い
    * uniformBranchBonus           // 分岐が均等に散らばっているか
    * (1 + avgDecoy * 0.3)        // デコイが深いほど良い
    * uniformDeepBonus;            // 深いデコイも均等か

  return { score, path, pathLen, totalBranches, branchPerSection, avgDecoy };
}

// --- 最良の迷路を選ぶ ---
function generateGoodMaze(rows, cols) {
  let bestGrid = null;
  let bestScore = -1;
  const attempts = 40; // 十分な試行回数で良質な迷路を選ぶ

  for (let i = 0; i < attempts; i++) {
    const grid = createGrid(rows, cols);
    carveMaze(grid, rows, cols);
    const { score } = scoreMaze(grid, rows, cols);
    if (score > bestScore) {
      bestScore = score;
      bestGrid = grid;
    }
  }
  return bestGrid;
}

// --- 白抜き矢印 ---
function drawArrow(cx, cy, size) {
  const hw = size * 0.45;
  const h  = size * 0.85;
  const sw = size * 0.18;
  const headH = size * 0.45;
  const top = -h / 2;
  const bot =  h / 2;

  ctx.save();
  ctx.translate(cx, cy);

  ctx.beginPath();
  ctx.moveTo(-sw, top);
  ctx.lineTo(-sw, bot - headH);
  ctx.lineTo(-hw, bot - headH);
  ctx.lineTo(0, bot);
  ctx.lineTo(hw, bot - headH);
  ctx.lineTo(sw, bot - headH);
  ctx.lineTo(sw, top);
  ctx.closePath();

  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.restore();
}

// --- メイン描画 ---
function drawMaze(grid, rows, cols) {
  const cellSize = getCellSize(cols);
  const mazeW = cols * cellSize;
  const mazeH = rows * cellSize;

  canvas.width  = mazeW + PADDING * 2;
  canvas.height = mazeH + PADDING * 2;

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const ox = PADDING;
  const oy = PADDING;

  ctx.strokeStyle = '#000';
  ctx.lineWidth = WALL_PX;
  ctx.lineCap = 'square';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = ox + c * cellSize;
      const y = oy + r * cellSize;
      const w = grid[r][c].walls;
      if (w[0]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cellSize, y); ctx.stroke(); }
      if (w[1]) { ctx.beginPath(); ctx.moveTo(x + cellSize, y); ctx.lineTo(x + cellSize, y + cellSize); ctx.stroke(); }
      if (w[2]) { ctx.beginPath(); ctx.moveTo(x, y + cellSize); ctx.lineTo(x + cellSize, y + cellSize); ctx.stroke(); }
      if (w[3]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + cellSize); ctx.stroke(); }
    }
  }

  // 開口部
  ctx.fillStyle = '#fff';
  ctx.fillRect(ox + 1, oy - WALL_PX, cellSize - 2, WALL_PX * 2);
  ctx.fillRect(ox + (cols - 1) * cellSize + 1, oy + rows * cellSize - WALL_PX, cellSize - 2, WALL_PX * 2);

  const arrowSize = Math.max(cellSize * 1.4, 32);
  drawArrow(ox + cellSize * 0.5, oy - arrowSize * 0.5 - 6, arrowSize);
  drawArrow(ox + (cols - 1) * cellSize + cellSize * 0.5, oy + rows * cellSize + arrowSize * 0.5 + 6, arrowSize);
}

// --- 難易度切り替え ---
function setDifficulty(level) {
  currentLevel = level;
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.level === level);
  });
  regenerate();
}

function regenerate() {
  const { cols, rows } = LEVELS[currentLevel];
  const grid = generateGoodMaze(rows, cols);
  drawMaze(grid, rows, cols);
}

regenerate();
</script>
</body>
</html>
